name: ECR release

# Manual production promotion: publishes this fork's own master build into
# Palmetto's ECR, mirroring the review-gated pattern pi-platform uses for its
# dormant patch-on-upstream lane (docs/runbooks/paperclip-image.md in
# pi-platform) rather than auto-publishing on every push to master the way
# docker.yml auto-publishes to GHCR. No push trigger: an operator dispatches
# this explicitly after reviewing what's on master.
on:
  workflow_dispatch:

permissions:
  {}

# Serialise pushes to the one immutable-image role: a newer dispatch
# supersedes only the pending slot, matching docker.yml's concurrency policy.
concurrency:
  group: ecr-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: paperclip/web
  # Palmetto's paperclip publisher role (pi-platform:opentofu/modules/iam-oidc).
  # Its trust policy accepts this exact repo's master branch in addition to
  # pi-platform's own main branch; its permissions policy is scoped to only
  # the paperclip/web ECR repository. This is a stable role ARN, not a
  # secret -- it is visible to anyone who can read the role in AWS IAM, so it
  # is inlined here rather than as a repo variable so the trust target is
  # visible in the reviewable workflow diff, not a separate hidden setting.
  ECR_PUSH_ROLE_ARN: arn:aws:iam::490600801675:role/pi-platform-github-actions-ecr-paperclip

jobs:
  # pi-platform-prod is all Graviton (arm64), and the ECR repository only had
  # an amd64 image before this change -- it never mattered until now because
  # the upstream image this cluster ran previously was multi-arch. Each
  # platform builds natively on its own runner rather than one job emulating
  # arm64 under QEMU on an amd64 runner: this is a Rust + pnpm monorepo
  # build, and a QEMU-emulated Rust compile is slow enough to risk the
  # 60-minute job timeout. GitHub's arm64-hosted runner is free on public
  # repositories (this repo is public), so the native leg costs nothing
  # extra. Each leg pushes its image by digest only, with no tag -- the
  # merge job below joins both digests into one multi-arch manifest list
  # under the real tag, the standard docker/build-push-action
  # distribute-across-runners pattern.
  build-and-push:
    name: Build and push (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Refuse to run against anything but master before AWS is even involved:
    # the OIDC trust condition already restricts the role to this exact
    # subject, so a mismatched ref would only surface as an opaque
    # AssumeRoleWithWebIdentity denial. Fail fast with a readable message.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Artifact names can't contain '/', and each matrix leg needs a unique
      # one to upload its digest without colliding with the other leg.
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # git describe below needs this. Mirrors docker.yml exactly so both
      # lanes stamp the same version scheme.
      - name: Compute build version
        id: build-version
        run: |
          set -euo pipefail
          version="$(git describe --tags --match 'v*' --long --dirty 2>/dev/null || true)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Stamping build version: ${version:-<none>}"

      - name: Compute tool cache epoch
        id: tools-epoch
        run: echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh lockfile for Docker build context
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile already matches package metadata."
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

          echo "Using refreshed pnpm-lock.yaml in the Docker build context."

      - name: Free runner disk
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h

          pnpm store prune || true
          sudo apt-get clean || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby || true
          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Palmetto ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.0.1
        id: ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same labels docker.yml stamps, so deployment tooling that checks
      # image/migrator compatibility works identically against either
      # registry. Computed on each leg so both per-platform images carry
      # them -- the merge job below only joins digests into a manifest
      # list, it does not build or relabel anything.
      - name: Compute schema migration labels
        id: schema
        run: |
          set -euo pipefail
          last=$(ls packages/db/src/migrations/*.sql | sed 's|.*/||' | LC_ALL=C sort | tail -1)
          count=$(ls packages/db/src/migrations/*.sql | wc -l | tr -d ' ')
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # Push by digest only, no tag: the immutable sha-<short> tag is applied
      # once, in the merge job below, to the joined manifest list. Pushing a
      # tag here too would race both legs against the same immutable tag and
      # only one would win.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.build-version.outputs.version }}
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ steps.tools-epoch.outputs.epoch }}
          labels: |
            io.github.paperclipai.schema.last-migration=${{ steps.schema.outputs.last }}
            io.github.paperclipai.schema.migration-count=${{ steps.schema.outputs.count }}
          outputs: type=image,name=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the two by-digest pushes above into one manifest list under the
  # real tag -- the standard docker/build-push-action multi-platform
  # distribute-across-runners pattern (build natively per-arch, push by
  # digest, then `buildx imagetools create` to publish the index). Each
  # underlying image keeps the labels it was built with; imagetools does not
  # relabel, it only writes the index that points at both digests.
  merge:
    name: Join platform digests into one manifest list
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same fail-fast rationale as the build job above -- this job also talks
    # to AWS, and `needs:` alone does not re-gate it on the ref.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      # Only needed for scripts/assert-orphan-reaping.sh, used by the PID 1
      # check at the end of this job.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Palmetto ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.0.1
        id: ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Immutable sha-<short> tag only -- ECR_REPOSITORY has immutable tags
      # enabled, so this is also a same-tag-twice guard: a second dispatch at
      # the same commit fails the push instead of silently overwriting.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha

      # Joins the two per-platform digests into one manifest list under the
      # tag computed above. Reads the digest files' names, not contents --
      # the pattern the official docker/build-push-action digest-export step
      # uses, since the digest is already encoded in each empty file's name.
      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_REPO: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args="${tag_args} -t ${tag}"
          done <<< "$IMAGE_TAGS"
          test -n "$tag_args"

          digest_refs=""
          for digest in *; do
            digest_refs="${digest_refs} ${REGISTRY_REPO}@sha256:${digest}"
          done
          test -n "$digest_refs"

          docker buildx imagetools create ${tag_args} ${digest_refs}

      # Cross-check the manifest-list digest ECR itself reports for this tag,
      # the same belt-and-suspenders pi-platform's own ECR lane uses
      # (paperclip-image.yml), and fail the job rather than hand the caller
      # a digest ECR does not actually have indexed yet.
      - name: Record and verify immutable image digest
        id: digest
        run: |
          set -euo pipefail
          ecr_digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="sha-$(printf %s "$GITHUB_SHA" | cut -c1-7)" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          case "${ecr_digest}" in
            sha256:*) ;;
            *) echo "ECR returned no immutable digest" >&2; exit 1 ;;
          esac

          echo "digest=${ecr_digest}" >> "$GITHUB_OUTPUT"

          registry_repo="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "Platforms in pushed manifest list:"
          docker buildx imagetools inspect "${registry_repo}@${ecr_digest}"

          echo "Published production image: ${registry_repo}@${ecr_digest}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      # Same PID 1 / zombie-reaping gate docker.yml runs, against the
      # manifest list this job just pushed to ECR rather than a local build.
      # Runs on this job's own (amd64) runner, matching what the original
      # single-arch lane checked; docker resolves the manifest list to the
      # runner's own platform.
      - name: Verify PID 1 reaps orphaned processes
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          test -n "$image"
          echo "Verifying orphan reaping in $image"
          docker run --rm -i --pull always "$image" sh -s < scripts/assert-orphan-reaping.sh
